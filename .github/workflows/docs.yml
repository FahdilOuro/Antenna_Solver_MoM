# Build the documentation website and, on main, publish it to GitHub Pages.
#
# Every push or pull request that touches the documentation or the solver
# rebuilds the site with warnings treated as errors, so a broken link, a
# missing figure or a docstring that no longer imports fails the check.
# Only a push to main deploys. Publication needs, once:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Documentation

on:
  push:
    branches: [main, feature/interactive-documentation]
    paths:
      - "documentation/**"
      - "solver/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "documentation/**"
      - "solver/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentation/requirements-docs.txt

      - name: Install the documentation tools
        run: python -m pip install -r documentation/requirements-docs.txt

      - name: Build the site (warnings are errors)
        run: python -m sphinx -W --keep-going -b html documentation/source documentation/_build/html

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
